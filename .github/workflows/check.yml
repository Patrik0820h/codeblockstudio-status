name: Status check

on:
  schedule:
    # Every 5 minutes. GitHub may delay a scheduled run under load, this
    # is a best-effort interval, not a guarantee.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # lets you trigger a check manually from the Actions tab

permissions:
  contents: write # the job commits the updated data/history.json back to this repo

concurrency:
  group: status-check
  cancel-in-progress: false # never skip/overlap a check, just queue the next one

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run checks
        run: node scripts/check.mjs

      - name: Commit updated status data
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet && exit 0
          git commit -m "Update status data"
          git push
